version: '3.8'

services:
  dashboard:
    image: dashboard-eba:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      # Enrutamiento basado en el subdominio
      - "traefik.http.routers.ebadashboard.rule=Host(`dashboard.agenteeba.online`)"
      # Entrypoint HTTPS (asegúrate de que en tu Traefik se llame 'websecure')
      - "traefik.http.routers.ebadashboard.entrypoints=websecure"
      # Configuración del resolver SSL (asegúrate de que en tu Traefik se llame 'letsencrypt' o 'production')
      - "traefik.http.routers.ebadashboard.tls.certresolver=letsencrypt"
      # Puerto interno del contenedor (Nginx corre en el 80)
      - "traefik.http.services.ebadashboard.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
